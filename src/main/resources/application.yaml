spring:
  application:
    name: cesi-zen-back

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cesizenDb}
    username: ${DB_USERNAME:cesizenUser}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


server:
  port: 8080

  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEY_STORE:classpath:certs/cesizen-local.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: cesizen-local


security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: cesi-zen-back
    access-token-validity-minutes: 15


app:
  frontend:
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:4200/reset-password}

  account:
    inactivity-days: 90

  diagnostic:
    retention-days: 365
    purge-cron: "0 0 23 * * *"

  security:
    csrf-cookie-secure: ${CSRF_COOKIE_SECURE:false}

    allowed-origins:
    - https://localhost:4200
    - http://localhost:4200
    - http://localhost:4300
    - https://localhost:8443
    - http://localhost:8080
    - http://localhost:8081


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never